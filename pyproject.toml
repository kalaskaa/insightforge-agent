[project]
name = "insightforge-agent"
version = "0.1.0"
description = "Autonomous Market Intelligence Engine"
readme = "README.md"
authors = [
    { name = "kalaskaa", email = "ashishkalaskar9@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.142.2",
    "jsonpatch>=1.33",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
